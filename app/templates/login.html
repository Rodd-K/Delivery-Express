{% extends "base.html" %}
{% block title %}Sign in · Express Mtaani{% endblock %}
{% block content %}
<section class="page page--narrow">
  <h1>Sign in</h1>
  {% if error %}<div class="alert alert--error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next_url }}">
    <label class="field"><span class="field__label">Email</span>
      <input name="email" type="email" autocomplete="username" required autofocus value="{{ email }}"></label>
    <label class="field"><span class="field__label">Password</span>
      <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn btn--primary btn--block" type="submit">Sign in</button>
  </form>
  <p class="hint">New here? <a href="{{ url_for('auth.register') }}">Create a customer account</a> or <a href="{{ url_for('auth.rider_register') }}">sign up as a rider</a>.</p>
</section>
{% endblock %}
