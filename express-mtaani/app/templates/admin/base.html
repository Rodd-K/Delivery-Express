{% extends "base.html" %}
{% block content %}
<div class="admin">
  <aside class="admin__nav" aria-label="Admin">
    <p class="admin__title">Admin</p>
    {% set here = request.endpoint %}
    <a href="{{ url_for('admin.dashboard') }}" {% if here == 'admin.dashboard' %}aria-current="page"{% endif %}>Dashboard</a>
    <a href="{{ url_for('admin.orders') }}" {% if here and here.startswith('admin.order') %}aria-current="page"{% endif %}>Orders</a>
    <a href="{{ url_for('admin.products') }}" {% if here and here.startswith('admin.product') %}aria-current="page"{% endif %}>Products</a>
    <a href="{{ url_for('admin.shops') }}" {% if here and here.startswith('admin.shop') %}aria-current="page"{% endif %}>Shops</a>
    <a href="{{ url_for('admin.riders') }}" {% if here and here.startswith('admin.rider') %}aria-current="page"{% endif %}>Riders</a>
  </aside>
  <div class="admin__main">{% block admin %}{% endblock %}</div>
</div>
{% endblock %}
